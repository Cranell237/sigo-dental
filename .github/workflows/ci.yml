name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm exec -w api -- prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # deepmerge-ts (vía prisma CLI, solo se usa al migrar) queda como riesgo aceptado hasta migrar a Prisma 7
      - run: npm audit --omit=dev --audit-level=critical

  codeql:
    # El análisis de código solo está disponible en repos públicos (o con GitHub Advanced Security).
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
